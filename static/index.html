<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SlopeMap Generator</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:15px system-ui;color:#173c30;background:#f4f7f5}header{padding:17px;background:#18533d;color:white;font-weight:700;font-size:20px}.layout{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 62px)}aside{padding:18px;overflow:auto}#map{height:100%}input,select,button{box-sizing:border-box;width:100%;padding:11px;margin:8px 0 16px;border:1px solid #cbd8d0;border-radius:8px}button{background:#18694d;color:white;cursor:pointer;font-weight:700}label{font-weight:600}small{color:#64776d}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}@media(max-width:720px){.layout{display:block;height:auto}#map{height:55vh}}</style></head><body><header>SlopeMap Generator</header><div class="layout"><aside><h3>Generate slope map</h3><label>Boundary source</label><select id="mode"><option value="upload">Upload parcel boundary</option><option value="admin">Administrative boundary</option></select><div id="upload"><label>Parcel file (ZIP Shapefile, GeoJSON, GPKG)</label><input id="file" type="file" accept=".zip,.geojson,.json,.gpkg,.kml"></div><div id="admin" hidden><label>Region</label><select id="region"></select><label>Province</label><select id="province"></select><label>Municipality / City</label><select id="municipality"></select><label>Barangay</label><select id="barangay"></select><small>Choose any available level.</small></div><button id="run">Generate slope map</button><p id="status"><small>Nationwide GIS data stored privately in Cloudflare R2. Upload a parcel to begin.</small></p><div id="results" hidden><h3>Slope statistics</h3><div id="stats"></div><button id="download">Download GeoJSON</button></div></aside><div id="map"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=id=>document.getElementById(id),map=L.map('map').setView([12.5,122.5],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);let layer,result;const levels=['region','province','municipality','barangay'];$('mode').onchange=()=>{$('upload').hidden=$('mode').value!=='upload';$('admin').hidden=$('mode').value!=='admin'};async function load(level,parent){const s=$(level);s.innerHTML='<option value="">— Select —</option>';if(parent===false)return;try{const r=await fetch('/boundaries?level='+level+(parent?'&parent_code='+encodeURIComponent(parent):''));if(!r.ok)throw Error('R2 boundary dataset unavailable');for(const x of await r.json())s.add(new Option(x.name,x.code))}catch(e){$('status').textContent=e.message}}levels.forEach((l,i)=>$(l).onchange=()=>{for(let j=i+1;j<levels.length;j++)load(levels[j],false);if(i+1<levels.length&&$(l).value)load(levels[i+1],$(l).value)});load('region');$('run').onclick=async()=>{const form=new FormData();if($('mode').value==='upload'){if(!$('file').files.length)return alert('Select parcel file');form.append('boundary_file',$('file').files[0])}else{const code=levels.map(x=>$(x).value).filter(Boolean).pop();if(!code)return alert('Select boundary');form.append('boundary_code',code)}$('status').textContent='Generating clipped slope map…';$('run').disabled=true;try{const r=await fetch('/generate',{method:'POST',body:form}),d=await r.json();if(!r.ok)throw Error(d.detail||'Generation failed');result=d;if(layer)map.removeLayer(layer);const palette=['#b4df9a','#eee38b','#f4b16e','#d97b55','#a94242'];layer=L.geoJSON(d,{style:f=>({color:'#44584d',weight:.5,fillOpacity:.8,fillColor:palette[Math.abs([...String(f.properties.slope_class)].reduce((a,c)=>a+c.charCodeAt(0),0))%5]})}).addTo(map);if(layer.getLayers().length)map.fitBounds(layer.getBounds());const table=document.createElement('table');table.innerHTML='<tr><th>Class</th><th>Area (ha)</th></tr>';for(const s of d.statistics){const tr=table.insertRow();tr.insertCell().textContent=s.slope_class;tr.insertCell().textContent=s.area_ha.toFixed(3)}$('stats').replaceChildren(table);$('results').hidden=false;$('status').textContent='Total classified area: '+d.total_classified_ha.toFixed(3)+' ha'}catch(e){$('status').textContent='Error: '+e.message}finally{$('run').disabled=false}};$('download').onclick=()=>{if(!result)return;const url=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/geo+json'})),a=document.createElement('a');a.href=url;a.download='slope-clipped.geojson';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
