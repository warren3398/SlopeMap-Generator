<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SlopeMap Generator</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:15px system-ui;color:#173c30;background:#f4f7f5}header{padding:17px;background:#18533d;color:white;font-weight:700;font-size:20px}.layout{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 62px)}aside{padding:18px;overflow:auto}#map{height:100%}input,select,button{box-sizing:border-box;width:100%;padding:11px;margin:8px 0 16px;border:1px solid #cbd8d0;border-radius:8px}button{background:#18694d;color:white;cursor:pointer;font-weight:700}label{font-weight:600}small{color:#64776d}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}@media(max-width:720px){.layout{display:block;height:auto}#map{height:55vh}}</style></head><body><header>SlopeMap Generator</header><div class="layout"><aside><h3>Generate slope map</h3><label>Boundary source</label><select id="mode"><option value="upload">Upload parcel boundary</option><option value="admin">Administrative boundary</option></select><div id="upload"><label>Parcel file (Shapefile ZIP, GeoJSON, GPKG, KML, KMZ)</label><input id="file" type="file" accept=".zip,.geojson,.json,.gpkg,.kml,.kmz"></div><div id="admin" hidden><label>Province</label><select id="province"></select><label>Municipality / City</label><select id="municipality"></select><label>Barangay</label><select id="barangay"></select><small>Choose any available level.</small></div><button id="run">Generate slope map</button><p id="status"><small>Nationwide GIS data stored privately in Cloudflare R2. Upload a parcel to begin.</small></p><div id="results" hidden><h3>Slope statistics</h3><div id="stats"></div><div id="legend" style="margin-top:12px;font-size:12px"><strong>Slope classification</strong><div id="legendrows"></div></div><button id="download">Download GeoJSON</button><button id="download-jpeg">Download Layout JPEG</button><button id="download-pdf">Download Layout PDF</button><button id="download-shp">Download Shapefile (ZIP)</button></div></aside><div id="map"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script><script>
const $=id=>document.getElementById(id),map=L.map('map').setView([12.5,122.5],6);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',maxZoom:19,crossOrigin:true}).addTo(map);L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);let layer,result;const levels=['province','municipality','barangay'];$('mode').onchange=()=>{$('upload').hidden=$('mode').value!=='upload';$('admin').hidden=$('mode').value!=='admin';if($('mode').value==='admin')load('province')};async function load(level,parent){const s=$(level);s.innerHTML='<option value="">Loading '+level+'…</option>';if(parent===false){s.innerHTML='<option value="">— Select —</option>';return;}try{const r=await fetch('/boundaries?level='+level+(parent?'&parent_code='+encodeURIComponent(parent):''));if(!r.ok){const err=await r.json().catch(()=>({}));throw Error((err.detail||'R2 boundary dataset unavailable')+' ('+level+')')}const options=await r.json();s.innerHTML='<option value="">— Select —</option>';for(const x of options)s.add(new Option(x.name,x.code));if(!options.length)$('status').textContent='No '+level+' boundaries found under selected area'}catch(e){s.innerHTML='<option value="">Unable to load — retry</option>';$('status').textContent='Boundary loading error: '+e.message}}levels.forEach((l,i)=>$(l).onchange=()=>{for(let j=i+1;j<levels.length;j++)load(levels[j],false);if(i+1<levels.length&&$(l).value){$('status').textContent='Loading '+levels[i+1]+'…';load(levels[i+1],$(l).value).then(()=>{if($('status').textContent.startsWith('Loading '))$('status').textContent=''})}});for(const [k,c] of Object.entries({A:'#418a41',B:'#89b340',C:'#dde340',D:'#ffe240',E:'#ffa340',F:'#ff0000'})){const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:7px;margin:5px 0';const sw=document.createElement('span');sw.style.cssText='display:inline-block;width:18px;height:12px;border:1px solid #777;background:'+c;row.append(sw,document.createTextNode(k+' — '+({A:'0–3%',B:'3–8%',C:'8–18%',D:'18–30%',E:'30–50%',F:'>50%'}[k])));$('legendrows').append(row)}load('province');$('run').onclick=async()=>{const form=new FormData();if($('mode').value==='upload'){if(!$('file').files.length)return alert('Select parcel file');form.append('boundary_file',$('file').files[0])}else{const code=levels.map(x=>$(x).value).filter(Boolean).pop();if(!code)return alert('Select boundary');form.append('boundary_code',code)}$('status').textContent='Generating clipped slope map…';$('run').disabled=true;try{const r=await fetch('/generate',{method:'POST',body:form}),d=await r.json();if(!r.ok)throw Error(d.detail||'Generation failed');result=d;if(layer)map.removeLayer(layer);const palette={A:'#418a41',B:'#89b340',C:'#dde340',D:'#ffe240',E:'#ffa340',F:'#ff0000'};const descriptions={A:'0–3% · Level to gently sloping',B:'3–8% · Gently sloping to undulating',C:'8–18% · Undulating to rolling',D:'18–30% · Rolling to moderately steep',E:'30–50% · Steep',F:'>50% · Very steep'};layer=L.geoJSON(d,{style:f=>({color:'#44584d',weight:.5,fillOpacity:classKey(f.properties.slope_class)?.length===1&&palette[classKey(f.properties.slope_class)]?.length?0.82:0,fillColor:palette[classKey(f.properties.slope_class)]||'#999999'})}).addTo(map);if(layer.getLayers().length)map.fitBounds(layer.getBounds());const table=document.createElement('table');table.innerHTML='<tr><th>Class</th><th>Area (ha)</th></tr>';for(const s of [...d.statistics].sort((a,b)=>('ABCDEF'.indexOf(classKey(a.slope_class))<0?99:'ABCDEF'.indexOf(classKey(a.slope_class)))-('ABCDEF'.indexOf(classKey(b.slope_class))<0?99:'ABCDEF'.indexOf(classKey(b.slope_class))))){const tr=table.insertRow();const k=classKey(s.slope_class);tr.insertCell().textContent=(k&&palette[k]?k+' — '+descriptions[k]:'No data / Unclassified');tr.insertCell().textContent=s.area_ha.toFixed(3)}$('stats').replaceChildren(table);$('results').hidden=false;$('status').textContent='Total classified area: '+d.total_classified_ha.toFixed(3)+' ha'}catch(e){$('status').textContent='Error: '+e.message}finally{$('run').disabled=false}};$('download').onclick=()=>{if(!result)return;const url=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/geo+json'})),a=document.createElement('a');a.href=url;a.download='slope-clipped.geojson';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};

const classKey=v=>{let x=String(v??'').trim().toUpperCase().replace(/[–—]/g,'-').replace(/%/g,'').replace(/\s+/g,'');if(/^[A-F]$/.test(x))return x;if(/^[1-6]$/.test(x))return 'ABCDEF'[Number(x)-1];if(x==='NAN'||x==='NULL'||x==='NONE'||x==='')return null;if(/^(?:>|>=|≥)\s*50|^50(?:\+|ANDABOVE|ANDOVER|ORABOVE|ORMORE|UP)/.test(x))return 'F';const m=x.match(/(\d+(?:\.\d+)?)(?:-|TO)(\d+(?:\.\d+)?)/);if(m){const a=Number(m[1]),b=Number(m[2]);return ({'0-3':'A','3-8':'B','8-18':'C','18-30':'D','30-50':'E'})[a+'-'+b]||x}return x};
const getPlace=()=>{if($('mode').value==='upload')return ['Uploaded Parcel','Parcel Boundary'];const selected=levels.map(id=>$(id).selectedOptions[0]?.textContent).filter(x=>x&&x!=='— Select —');return [selected[selected.length-1]||'Selected Area',selected.slice(0,-1).reverse().join(', ')||'Philippines']};
const saveBlob=(blob,name)=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)};
const layoutCanvas=async()=>{
 if(!result)throw Error('Generate a slope map first');
 
 $('status').textContent='Preparing printable slope map…';

 // Render a dedicated print-size map, not the browser's screen-shaped map.
 // This ensures that fitBounds uses exactly the printed map frame's aspect ratio.
 const printW=2440,printH=2060;
 const host=document.createElement('div');
 host.style.cssText='position:fixed;left:-20000px;top:0;width:'+printW+'px;height:'+printH+'px;pointer-events:none;';
 document.body.append(host);
 const exportMap=L.map(host,{zoomControl:false,attributionControl:false,fadeAnimation:false,zoomAnimation:false});
 const imagery=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,crossOrigin:true});
 imagery.addTo(exportMap);
 const snapshot=document.createElement('canvas');snapshot.width=printW;snapshot.height=printH;
 try{
   exportMap.invalidateSize();
   const bounds=layer&&layer.getLayers().length?layer.getBounds():map.getBounds();
   exportMap.fitBounds(bounds,{padding:[18,18],animate:false,maxZoom:16});
   let xs=[],ys=[];
   for(const feature of result.features||[]){
     const k=classKey(feature.properties?.slope_class);
     if(!k||!'ABCDEF'.includes(k))continue;
     const g=feature.geometry||{};
     const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
     for(const poly of polys)for(const ring of poly)for(const coord of ring){
       const p=exportMap.project([coord[1],coord[0]],exportMap.getZoom());
       if(Number.isFinite(p.x)&&Number.isFinite(p.y)){xs.push(p.x);ys.push(p.y)}
     }
   }
   if(xs.length){
     const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
     const scale=Math.min(printW*.88/Math.max(1,x1-x0),printH*.88/Math.max(1,y1-y0));
     const center=exportMap.unproject([(x0+x1)/2,(y0+y1)/2],exportMap.getZoom());
     exportMap.setView(center,Math.min(17,Math.max(1,exportMap.getZoom()+Math.log2(scale))),{animate:false});
   }
   await new Promise(resolve=>setTimeout(resolve,1200));
   const sc=snapshot.getContext('2d');sc.fillStyle='#e4e8e3';sc.fillRect(0,0,printW,printH);
   const mapRect=host.getBoundingClientRect();
   for(const img of host.querySelectorAll('.leaflet-tile-loaded')){
     const rect=img.getBoundingClientRect();
     try{sc.drawImage(img,rect.left-mapRect.left,rect.top-mapRect.top,rect.width,rect.height)}catch(_){}
   }
   const palette={A:'#418a41',B:'#89b340',C:'#dde340',D:'#ffe240',E:'#ffa340',F:'#ff0000'};
   for(const feature of result.features||[]){
     const k=classKey(feature.properties?.slope_class);
     if(!palette[k])continue;
     const geom=feature.geometry||{},polys=geom.type==='Polygon'?[geom.coordinates]:geom.type==='MultiPolygon'?geom.coordinates:[];
     sc.beginPath();
     for(const poly of polys)for(const ring of poly){ring.forEach((pt,i)=>{const p=exportMap.latLngToContainerPoint([pt[1],pt[0]]);if(i===0)sc.moveTo(p.x,p.y);else sc.lineTo(p.x,p.y)});sc.closePath()}
     sc.fillStyle=palette[k];sc.globalAlpha=.82;sc.fill('evenodd');sc.globalAlpha=1;
   }
 }finally{exportMap.remove();host.remove()}

 const c=document.createElement('canvas');c.width=3600;c.height=2240;const x=c.getContext('2d');x.scale(2,2);
 x.fillStyle='white';x.fillRect(0,0,1800,1120);
 x.strokeStyle='#263c31';x.lineWidth=2;x.strokeRect(12,12,1776,1096);
 const mx=40,my=45,mw=1220,mh=1030;
 x.drawImage(snapshot,mx,my,mw,mh);
 x.strokeStyle='#1b2e26';x.lineWidth=3;x.strokeRect(mx,my,mw,mh);
 x.font='bold 38px Arial';x.textAlign='center';x.fillStyle='white';x.strokeStyle='#15231b';x.lineWidth=5;x.strokeText('N',1200,105);x.fillText('N',1200,105);
 x.beginPath();x.moveTo(1200,118);x.lineTo(1186,156);x.lineTo(1200,147);x.lineTo(1214,156);x.closePath();x.fillStyle='white';x.fill();x.stroke();
 const sx=1290,sw=475;let y=45;
 const bar=(title,h=45)=>{x.fillStyle='#075328';x.fillRect(sx,y,sw,h);x.fillStyle='white';x.font='bold 24px Arial';x.textAlign='center';x.fillText(title,sx+sw/2,y+h/2+9);y+=h};
 const box=(height)=>{x.strokeStyle='#24553a';x.lineWidth=2;x.strokeRect(sx,y,sw,height);x.fillStyle='#151515';x.textAlign='left'};
 bar('SLOPE MAP',75);
 const place=getPlace();x.fillStyle='white';x.fillRect(sx,y,sw,95);x.fillStyle='#111';x.font='bold 25px Arial';x.textAlign='center';x.fillText(place[0].slice(0,32),sx+sw/2,y+39);x.font='20px Arial';x.fillText(place[1].slice(0,40),sx+sw/2,y+72);box(95);y+=105;
 bar('Legend',39);x.fillStyle='#fff';x.fillRect(sx,y,sw,285);box(285);
 const labels=[['A','0–3%','Level to nearly level','#418a41'],['B','3–8%','Gently sloping','#89b340'],['C','8–18%','Sloping','#dde340'],['D','18–30%','Moderately steep','#ffe240'],['E','30–50%','Steep','#ffa340'],['F','>50%','Very steep','#ff0000']];
 x.textAlign='left';x.fillStyle='#111';x.font='bold 19px Arial';x.fillText('Slope Class (Percent)',sx+17,y+31);
 labels.forEach((r,i)=>{const yy=y+53+i*34;x.fillStyle=r[3];x.fillRect(sx+18,yy-17,30,23);x.fillStyle='#111';x.font='18px Arial';x.fillText(r[0],sx+64,yy+2);x.fillText(r[1],sx+108,yy+2);x.font='16px Arial';x.fillText(r[2],sx+226,yy+2)});
 y+=296;bar('Slope Class Summary',39);
 const sums={};for(const t of result.statistics||[]){const k=classKey(t.slope_class);if(k&&'ABCDEF'.includes(k)&&k.length===1)sums[k]=(sums[k]||0)+Number(t.area_ha)};
 const total=Object.values(sums).reduce((a,b)=>a+b,0);
 const ty=y,tableH=265,headerH=42,rowH=29;
 x.fillStyle='#fff';x.fillRect(sx,ty,sw,tableH);
 x.strokeStyle='#24553a';x.lineWidth=2;x.strokeRect(sx,ty,sw,tableH);
 const col1=sx+18,col2=sx+322,col3=sx+sw-18;
 x.fillStyle='#eef3ef';x.fillRect(sx+2,ty+2,sw-4,headerH);
 x.fillStyle='#111';x.font='bold 17px Arial';
 x.textAlign='left';x.fillText('Class',col1,ty+28);
 x.textAlign='right';x.fillText('Area (ha)',col2,ty+28);x.fillText('Area (%)',col3,ty+28);
 x.strokeStyle='#c7d4cb';x.lineWidth=1;
 for(let i=0;i<=7;i++){const lineY=ty+headerH+i*rowH;x.beginPath();x.moveTo(sx+2,lineY);x.lineTo(sx+sw-2,lineY);x.stroke()}
 const fmt=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
 labels.forEach((r,i)=>{
   const yy=ty+headerH+i*rowH+20;
   x.fillStyle='#111';x.font='17px Arial';
   x.textAlign='left';x.fillText(r[0],col1,yy);
   x.textAlign='right';x.fillText(fmt(sums[r[0]]||0),col2,yy);
   x.fillText(total?fmt((sums[r[0]]||0)*100/total):'0.00',col3,yy);
 });
 const totalY=ty+headerH+6*rowH+21;
 x.fillStyle='#111';x.font='bold 17px Arial';x.textAlign='left';x.fillText('TOTAL',col1,totalY);
 x.textAlign='right';x.fillText(fmt(total),col2,totalY);x.fillText(total?'100.00':'0.00',col3,totalY);
 x.textAlign='left';y=ty+tableH+11;
 bar('Map Information',39);x.fillStyle='white';x.fillRect(sx,y,sw,165);box(165);x.fillStyle='#111';x.font='17px Arial';x.textAlign='left';
 ['Basemap: Esri World Imagery','Coordinates: WGS 84 (EPSG:4326)','Slope: Classified polygons (A–F)','Generated: '+new Date().toLocaleDateString('en-PH'),'No data is excluded from class totals'].forEach((line,i)=>x.fillText(line,sx+14,y+30+i*27));
 return c;
};
$('download-jpeg').onclick=async()=>{try{const c=await layoutCanvas();c.toBlob(b=>{if(!b){$('status').textContent='JPEG encoding failed';return}saveBlob(b,'slope-map-layout-HD.jpg');$('status').textContent='JPEG layout ready'},'image/jpeg',.98)}catch(e){$('status').textContent='JPEG error: '+e.message}};
$('download-pdf').onclick=async()=>{try{const c=await layoutCanvas();if(!window.jspdf)throw Error('PDF library unavailable');const pdf=new jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a3'});pdf.addImage(c.toDataURL('image/jpeg',.98),'JPEG',0,0,420,297);pdf.save('slope-map-layout.pdf');$('status').textContent='PDF layout ready'}catch(e){$('status').textContent='PDF error: '+e.message}};
$('download-shp').onclick=async()=>{if(!result)return alert('Generate a slope map first');$('status').textContent='Preparing Shapefile ZIP…';try{const r=await fetch('/download/shapefile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.detail||'Shapefile export failed')}saveBlob(await r.blob(),'slope-map-shapefile.zip');$('status').textContent='Shapefile ZIP ready'}catch(e){$('status').textContent='Shapefile error: '+e.message}};
</script></body></html>
